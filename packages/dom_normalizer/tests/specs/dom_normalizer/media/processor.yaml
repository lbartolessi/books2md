# File: tests/specs/dom_normalizer/media/processor.yaml
package: media
dependencies: ["core"]
pipeline_position: 5
test_cases:
  - id: EXTRACT_BASE64_IMAGE
    target: "Base64 media extraction (Layer A)"
    description: "Verifies a Base64-encoded `<img>` is extracted, saved as a file, and its `src` is replaced with the new relative path."
    context:
      book_base_name: "test_book"
    input:
      html: '<body><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" alt="pixel"/></body>'
    expected:
      html: '<body><figure class="image-block"><img alt="pixel" src="../media/extracted/asset_d2c753435521f7765a5a84a3b438969b3b465c84437a9b1343370339964b64c7.png"/></figure></body>'
      telemetry:
        base64_media_extracted: 1
        images_processed: 1
      files_written:
        - path: "test_book/media/extracted/asset_d2c753435521f7765a5a84a3b438969b3b465c84437a9b1343370339964b64c7.png"
          content_hash: "d2c753435521f7765a5a84a3b438969b3b465c84437a9b1343370339964b64c7"

  - id: RELOCATE_LOCAL_IMAGE
    target: "Local media relocation (Layer B)"
    description: "Verifies a local image is moved to the sibling asset directory and its `src` is updated."
    context:
      book_base_name: "test_book"
    input:
      html: '<body><img src="assets/local.jpg" alt="local"/></body>'
    expected:
      html: '<body><figure class="image-block"><img alt="local" src="../media/images/asset_placeholder-hash.jpg"/></figure></body>'
      telemetry:
        local_media_relocated: 1
        images_processed: 1
      files_written:
        - path: "test_book/media/images/asset_placeholder-hash.jpg"
          content_hash: "placeholder-hash"

  - id: WRAP_EXTERNAL_VIDEO
    target: "External video wrapping (Layer C)"
    description: "Verifies an external video iframe is wrapped in a semantic container with a placeholder image."
    context:
      external_video_domains: ["youtube.com"]
    input:
      html: '<body><iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" width="560" height="315"></iframe></body>'
    expected:
      html: |
        <body>
          <div class="protected video-block" data-video-src="https://www.youtube.com/embed/dQw4w9WgXcQ" height="315" width="560">
            <img alt="External video content" src="placeholder.png" height="315" width="560"/>
          </div>
        </body>
      telemetry:
        external_videos_wrapped: 1

  - id: PURGE_UNSUPPORTED_MEDIA
    target: "Unsupported media purging (Layer D)"
    description: "Verifies that an unsupported tag like `<script>` is replaced with a placeholder paragraph."
    input:
      html: "<body><p>Some text</p><script>alert('hello');</script></body>"
    expected:
      html: '<body><p>Some text</p><p class="media-placeholder"><em>[Multimedia Element Omitted: Script or interactive component unsupported by portable layouts]</em></p></body>'
      telemetry:
        unsupported_media_purged: 1

  - id: CODE_SHIELD_PROTECTION
    target: "Code Shield"
    description: "Verifies that media tags inside `<code>` or `<pre>` blocks are ignored by all handlers."
    input:
      html: '<body><pre><code><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII="/></code></pre></body>'
    expected:
      html: '<body><pre><code><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII="/></code></pre></body>'
      telemetry:
        base64_media_extracted: 0
        local_media_relocated: 0
        external_videos_wrapped: 0
        unsupported_media_purged: 0

  - id: RELOCATE_LOCAL_VIDEO_WITH_SOURCES
    target: "Local media relocation (Layer B)"
    description: "Verifies a local `<video>` tag and its `<source>` children are processed, relocated, and updated."
    context:
      book_base_name: "test_book"
    input:
      html: |
        <body>
          <video src="assets/movie.mp4" poster="assets/poster.jpg">
            <source src="assets/movie.webm" type="video/webm">
            <track kind="captions" src="assets/captions.vtt">
          </video>
        </body>
    expected:
      html: |
        <body>
         <figure class="video-block">
          <video controls="" poster="../media/images/asset_placeholder-hash.jpg" src="../media/video/asset_placeholder-hash.mp4">
           <source src="../media/video/asset_placeholder-hash.webm" type="video/webm"/>
           <track kind="captions" src="assets/captions.vtt"/>
          </video>
         </figure>
        </body>
      telemetry:
        local_media_relocated: 3
        video_files_processed: 2
        images_processed: 1
      files_written:
        - path: "test_book/media/video/asset_placeholder-hash.mp4"
          content_hash: "placeholder-hash"
        - path: "test_book/media/images/asset_placeholder-hash.jpg"
          content_hash: "placeholder-hash"
        - path: "test_book/media/video/asset_placeholder-hash.webm"
          content_hash: "placeholder-hash"
